user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream statis hanya dipakai sebagai fallback bila resolver belum tersedia.
    # Pembagian beban utama dilakukan oleh resolver Docker (127.0.0.11) yang
    # me-resolve nama service ke seluruh IP replika setiap 5 detik.
    upstream pwave_detectors {
        server p_wave_detector_load_balance:8004;
    }

    server {
        listen 80;
        server_name localhost;

        # Resolver Docker internal — pastikan nama di-resolve ulang setiap 5 detik
        # sehingga replika yang baru naik langsung menerima beban.
        resolver 127.0.0.11 valid=5s;

        location / {
            # Gunakan variabel agar NGINX me-resolve DNS per permintaan,
            # bukan hanya sekali saat startup.
            set $upstream http://p_wave_detector_load_balance:8004;
            proxy_pass $upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Status NGINX — dapat di-scrape oleh nginx-prometheus-exporter
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
