# ==============================================================================
# EEWS FINAL PRODUCTION ARCHITECTURE
# Konfigurasi: Multiprocess, NGINX Load Balancer, 5 ML Worker, 3 Archiver, FastAPI
# Perintah    : docker compose -f docker-compose-final.yml up -d --build
# ==============================================================================

services:
  # --- INFRASTRUKTUR INTI ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: always
    container_name: zookeeper
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.7.1
    tty: true
    restart: always
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka2:
    image: confluentinc/cp-kafka:7.7.1
    tty: true
    restart: always
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:7.7.1
    tty: true
    restart: always
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  # --- DATABASE & OBSERVABILITAS ---
  mongo:
    image: mongo:7
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./mongo:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}
    depends_on:
      - mongo

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    env_file:
      - ./influxDB/.env
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: always

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    env_file:
      - .env
    ports:
      - "4000:3000"
    environment:
      GF_SERVER_ROOT_URL: http://localhost:4000
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-12345678}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    depends_on:
      - influxdb

  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    user: root
    entrypoint: ["telegraf"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "9273:9273"
    restart: always

  # --- GENERATOR DATA (Pemenang S1: Multiprocess) ---
  data_provider:
    container_name: data_provider
    build:
      context: .
      dockerfile: data_provider/Dockerfile
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  # --- ARSITEKTUR HTTP P-WAVE (Pemenang S3: Kafka + NGINX Load Balancer & S4: 5 ML Replicas) ---
  nginx_load_balancer:
    image: nginx:latest
    container_name: nginx_load_balancer
    ports:
      - "8004:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - p_wave_detector_load_balance
    restart: always

  load_balancer:
    build:
      context: .
      dockerfile: load_balancer/Dockerfile
    deploy:
      replicas: 1
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  p_wave_detector_load_balance:
    build:
      context: .
      dockerfile: p_wave_detector_load_balance/Dockerfile
    deploy:
      replicas: 5
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  loc_mag_detector:
    build:
      context: .
      dockerfile: loc_mag_detector/Dockerfile
    deploy:
      replicas: 1
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  data_archiver:
    build:
      context: .
      dockerfile: data_archiver/Dockerfile
    deploy:
      replicas: 3
    volumes:
      - ./data_archiver/data_archive:/mnt/data
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
      - influxdb
      - mongo
      - mongo-express
    restart: always

  # --- DISEMINASI WEBSOCKET (Pemenang S5: FastAPI WebSocket) ---
  fast_api:
    container_name: fast_api
    build:
      context: .
      dockerfile: fast_api/Dockerfile
    ports:
      - "3334:3333"
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  # --- PRODUKSI SAFEGUARD (Memory Leak Prevention) ---
  restarter:
    image: docker:cli
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 600
          # Restart bergilir untuk HTTP worker dan Archiver
          docker restart eews-p_wave_detector_load_balance-1 eews-data_archiver-1 2>/dev/null || docker restart eews_p_wave_detector_load_balance_1 eews_data_archiver_1 2>/dev/null || true
          sleep 30
          docker restart eews-p_wave_detector_load_balance-2 eews-data_archiver-2 2>/dev/null || docker restart eews_p_wave_detector_load_balance_2 eews_data_archiver_2 2>/dev/null || true
          sleep 30
          docker restart eews-p_wave_detector_load_balance-3 eews-data_archiver-3 2>/dev/null || docker restart eews_p_wave_detector_load_balance_3 eews_data_archiver_3 2>/dev/null || true
          sleep 30
          docker restart eews-p_wave_detector_load_balance-4 2>/dev/null || docker restart eews_p_wave_detector_load_balance_4 2>/dev/null || true
          sleep 30
          docker restart eews-p_wave_detector_load_balance-5 2>/dev/null || docker restart eews_p_wave_detector_load_balance_5 2>/dev/null || true
        done

volumes:
  prometheus_data:
  influxdb_data:
