# ==============================================================================
# SKENARIO    : S2 — Overhead Instrumentasi Prometheus
# KONFIGURASI : Tanpa Instrumentasi Prometheus (Library observabilitas dinonaktifkan sepenuhnya)
# PERINTAH    : docker compose -f docker-compose-s2-no_metrics.yml up -d --build
# ==============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: always
    container_name: zookeeper
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.7.1
    restart: always
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka2:
    image: confluentinc/cp-kafka:7.7.1
    restart: always
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:7.7.1
    restart: always
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  mongo:
    image: mongo:7
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./mongo:/data/db

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    env_file:
      - ./influxDB/.env
    restart: always

  # NO Prometheus, NO Node Exporter in this scenario
  # Grafana kept for baseline comparison only
  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    ports:
      - "4000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-12345678}
    restart: always

  data_provider:
    container_name: data_provider
    build:
      context: .
      dockerfile: data_provider/Dockerfile
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "false"
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - kafka1
    restart: always

  p_wave_detector:
    build:
      context: .
      dockerfile: p_wave_detector/Dockerfile
    deploy:
      replicas: 3
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "false"
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - kafka1
    restart: always

  loc_mag_detector:
    build:
      context: .
      dockerfile: loc_mag_detector/Dockerfile
    deploy:
      replicas: 1
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "false"
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - kafka1
    restart: always

  data_archiver:
    build:
      context: .
      dockerfile: data_archiver/Dockerfile
    deploy:
      replicas: 3
    volumes:
      - ./data_archiver/data_archive:/mnt/data
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "false"
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - kafka1
      - influxdb
      - mongo
    restart: always

  api_server:
    container_name: api_server
    build:
      context: .
      dockerfile: api_server/Dockerfile
    ports:
      - "3333:3333"
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "false"
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - kafka1
    restart: always

  fast_api:
    container_name: fast_api
    build:
      context: .
      dockerfile: fast_api/Dockerfile
    ports:
      - "3334:3333"
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "false"
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - kafka1
    restart: always


