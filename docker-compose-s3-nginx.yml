# ==============================================================================
# SKENARIO    : S3 — Kafka Native
# KONFIGURASI : Kafka Native (3 Broker Kafka tanpa NGINX)
# PERINTAH    : docker compose -f docker-compose-s3-kafka.yml up -d --build
# ==============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: always
    container_name: zookeeper
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka1:
    image: confluentinc/cp-kafka:7.7.1
    restart: always
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka2:
    image: confluentinc/cp-kafka:7.7.1
    restart: always
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:7.7.1
    restart: always
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  mongo:
    image: mongo:7
    restart: always
    ports:
      - 27017:27017
    volumes:
      - ./mongo:/data/db

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    env_file:
      - ./influxDB/.env
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: always

  grafana:
    image: grafana/grafana:11.2.2
    container_name: grafana
    env_file:
      - .env
    ports:
      - "4000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-12345678}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    depends_on:
      - prometheus

  data_provider:
    container_name: data_provider
    build:
      context: .
      dockerfile: data_provider/Dockerfile
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "true"
    depends_on:
      - kafka1
    restart: always

  # Kafka -> Load Balancer Service -> NGINX -> HTTP P-Wave Detectors
  p_wave_detector_load_balance:
    build:
      context: .
      dockerfile: p_wave_detector_load_balance/Dockerfile
    deploy:
      replicas: 4
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "true"
    depends_on:
      - kafka1
    restart: always

  loc_mag_detector:
    build:
      context: .
      dockerfile: loc_mag_detector/Dockerfile
    deploy:
      replicas: 1
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "true"
    depends_on:
      - kafka1
    restart: always

  load_balancer:
    build:
      context: .
      dockerfile: load_balancer/Dockerfile
    deploy:
      replicas: 1
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "true"
      LB_TARGET_URL: "http://nginx_load_balancer:80/trace"
    depends_on:
      - kafka1
    restart: always

  data_archiver:
    build:
      context: .
      dockerfile: data_archiver/Dockerfile
    deploy:
      replicas: 1
    volumes:
      - ./data_archiver/data_archive:/mnt/data
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "true"
    depends_on:
      - kafka1
      - influxdb
      - mongo
    restart: always

  api_server:
    container_name: api_server
    build:
      context: .
      dockerfile: api_server/Dockerfile
    ports:
      - "3333:3333"
      - "8107:8107"
    tty: true
    env_file:
      - .env
    environment:
      ENABLE_METRICS: "true"
    depends_on:
      - kafka1
    restart: always

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: always

  nginx_load_balancer:
    image: nginx:1.27
    container_name: nginx_load_balancer
    ports:
      - "8004:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - p_wave_detector_load_balance
    restart: always

  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    user: root
    entrypoint: ["telegraf"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "9273:9273"
    restart: always

volumes:
  prometheus_data:
  grafana_data:
