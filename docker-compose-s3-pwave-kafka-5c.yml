# ==============================================================================
# SKENARIO    : S3 — Skalabilitas Worker Node (P-Wave Detector)
# KONFIGURASI : Kafka Native - 5 Container P-Wave Detector
# PERINTAH    : docker compose -f docker-compose-s3-pwave-kafka-5c.yml up -d --build
# ==============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    restart: always
    container_name: zookeeper
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
  kafka1:
    image: confluentinc/cp-kafka:7.7.1
    tty: true
    restart: always
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_HOST_NAME: kafka1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      KAFKA_LOG_RETENTION_MS: 600000  
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka2:
    image: confluentinc/cp-kafka:7.7.1
    tty: true
    restart: always
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_HOST_NAME: kafka2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  kafka3:
    image: confluentinc/cp-kafka:7.7.1
    tty: true
    restart: always
    container_name: kafka3
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_HOST_NAME: kafka3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LOG_RETENTION_MS: 600000
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    depends_on:
      - zookeeper

  mongo:
    image: mongo:7
    restart: always
    ports:
      - 27017:27017
    volumes:
        - ./mongo:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}
    depends_on:
      - mongo

  influxdb:
    image: influxdb:latest
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxDB:/var/lib/influxdb
    env_file:
      - ./influxDB/.env
    restart: always

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_file:
      - .env
    ports:
      - "4000:3000"    
    environment:
      GF_SERVER_ROOT_URL: http://localhost:4000
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-12345678}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: always
    depends_on:
      - influxdb

  data_provider:
    container_name: data_provider
    build:
      context: .
      dockerfile: data_provider/Dockerfile
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  p_wave_detector:
    build:
      context: .
      dockerfile: p_wave_detector/Dockerfile
    deploy:
      replicas: 5
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  loc_mag_detector:
    build:
      context: .
      dockerfile: loc_mag_detector/Dockerfile
    deploy:
      replicas: 1
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  restarter:
    image: docker:cli
    restart: unless-stopped
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        while true; do
          # docker ps

          sleep 600
          docker restart eews-p_wave_detector_load_balance-1
          docker restart eews-p_wave_detector-1
          docker restart eews-data_archiver-1
          
          # for topic in $(docker exec kafka1 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:9092 --list); do
          #   for partition in $(docker exec kafka1 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:9092 --describe --topic $topic | grep 'Partition:' | awk '{print $2}'); do
          #     docker exec kafka1 /opt/kafka/bin/kafka-delete-records.sh --bootstrap-server kafka1:9092 --offset-json "{\"partitions\":[{\"topic\":\"$topic\",\"partition\":$partition,\"offset\":10}]}"
          #   done
          # done
          
          sleep 30
          docker restart eews-p_wave_detector_load_balance-2
          docker restart eews-p_wave_detector-2
          docker restart eews-data_archiver-2

          sleep 30
          docker restart eews-p_wave_detector_load_balance-3
          docker restart eews-p_wave_detector-3
          docker restart eews-data_archiver-3

          # for topic in $(docker exec kafka2 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka2:9093 --list); do
          #   for partition in $(docker exec kafka2 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka2:9093 --describe --topic $topic | grep 'Partition:' | awk '{print $2}'); do
          #     docker exec kafka2 /opt/kafka/bin/kafka-delete-records.sh --bootstrap-server kafka2:9093 --offset-json "{\"partitions\":[{\"topic\":\"$topic\",\"partition\":$partition,\"offset\":10}]}"
          #   done
          # done

          sleep 30
          docker restart eews-p_wave_detector_load_balance-4
          docker restart eews-p_wave_detector-4
          docker restart eews-data_archiver-4
          
          sleep 30
          docker restart eews-p_wave_detector_load_balance-5
          docker restart eews-p_wave_detector-5
          docker restart eews-data_archiver-5

          # for topic in $(docker exec kafka3 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka3:9094 --list); do
          #   for partition in $(docker exec kafka3 /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka3:9094 --describe --topic $topic | grep 'Partition:' | awk '{print $2}'); do
          #     docker exec kafka3 /opt/kafka/bin/kafka-delete-records.sh --bootstrap-server kafka3:9094 --offset-json "{\"partitions\":[{\"topic\":\"$topic\",\"partition\":$partition,\"offset\":10}]}"
          #   done
          # done
        done

  data_archiver:
    build:
      context: .
      dockerfile: data_archiver/Dockerfile
    deploy:
      replicas: 5
    volumes:
      - ./data_archiver/data_archive:/mnt/data
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
      - influxdb
      - mongo
      - mongo-express
    restart: always

  api_server:
    container_name: api_server
    build:
      context: .
      dockerfile: api_server/Dockerfile
    ports:
      - "3333:3333"
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always

  fast_api:
    container_name: fast_api
    build:
      context: .
      dockerfile: fast_api/Dockerfile
    ports:
      - "3334:3333"
    tty: true
    env_file:
      - .env
    depends_on:
      - kafka1
    restart: always
  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    user: root
    entrypoint: ["telegraf"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "9273:9273"
    restart: always

volumes:
  prometheus_data:

